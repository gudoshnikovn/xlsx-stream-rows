name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      # Required for npm provenance via OIDC (trusted publishing).
      # No NPM_TOKEN needed once the package is configured as a Trusted
      # Publisher on npmjs.com (Settings → Trusted Publishers).
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # `--ignore-scripts` skips `prepublishOnly` — build is already done above.
      - name: Publish
        run: npm publish --provenance --access public --ignore-scripts
